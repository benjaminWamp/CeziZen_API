# .github/workflows/ci-cd.yml
name: CI/CD NestJS + Docker

on:
  push:
  # pull_request:
  #   branches:
  #     - main
  #     - dev
  #     - feat/githubAction

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js & Cache
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    name: 🏗 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  test:
    name: ✅ Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - name: Run Jest
        run: npm run test -- --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage
          retention-days: 5

  docker:
    name: 🐋 Build & Push Docker
    runs-on: ubuntu-latest
    # if: contains(github.ref, 'recette')
    # needs: test
    permissions:
      contents: read
      packages: write
    env: 
      DATABASE_URL: "mysql://leadAdmin:leadAdminP@55w0rd@database:3306/vivactive?schema=public"
      NEST_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_aGVhbHRoeS1waWdlb24tNjUuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_EVJU56xeaHsnNrW32eMimpo1TOOjTkzPzc6TvC1ODX
      ENV_DATABASE: vivactive
      ENV_USER: leadAdmin
      ENV_PASSWORD: leadAdminP@55w0rd
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: cezeizen_api
          tags: ghcr.io/benjaminwamp/cezeizen_api/cezeizen_api:recette  

  deploy-docker-on-recette:
    runs-on: ubuntu-latest
    # if: contains(github.ref, 'recette')
